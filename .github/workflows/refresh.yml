name: Refresh dashboard data

on:
  schedule:
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Aggregate monorepo data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch combined data from all monorepos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repos = ['quant-econ', 'news-dashboards', 'agent-tools', 'geo-unity'];
            const data = { generated_at: new Date().toISOString(), repos: [] };

            for (const name of repos) {
              const { data: repo } = await github.rest.repos.get({ owner: 'muxd22-alt', repo: name });
              const { data: langs } = await github.rest.repos.listLanguages({ owner: 'muxd22-alt', repo: name });
              const { data: tree } = await github.rest.git.getTree({
                owner: 'muxd22-alt', repo: name, tree_sha: repo.default_branch, recursive: '1',
              });

              const member_stats = {};
              for (const t of tree.tree) {
                if (t.type !== 'blob' || !t.path.startsWith('repos/')) continue;
                const m = t.path.split('/')[1];
                if (!m) continue;
                member_stats[m] = member_stats[m] || { files: 0, bytes: 0 };
                member_stats[m].files += 1;
                member_stats[m].bytes += t.size || 0;
              }

              const { data: commits } = await github.rest.repos.listCommits({
                owner: 'muxd22-alt', repo: name, per_page: 20,
              });
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: 'muxd22-alt', repo: name, per_page: 6,
              });

              data.repos.push({
                name,
                description: repo.description,
                url: repo.html_url,
                stars: repo.stargazers_count,
                size_kb: repo.size,
                pushed_at: repo.pushed_at,
                archived: repo.archived,
                languages: langs,
                members: Object.keys(member_stats),
                member_stats,
                commits: commits.map(c => ({
                  sha: c.sha.slice(0, 7),
                  msg: c.commit.message.split('\n')[0],
                  date: c.commit.author.date,
                  author: c.commit.author.name,
                })),
                runs: runs.workflow_runs.map(r => ({
                  name: r.name,
                  status: r.status,
                  conclusion: r.conclusion,
                  url: r.html_url,
                  created_at: r.created_at,
                })),
              });
            }

            fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
            core.info(`collected ${data.repos.length} repos`);

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged"
          else
            git commit -m "Refresh dashboard data"
            git push
          fi
