name: Refresh dashboard data

on:
  schedule:
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Collect repo content (trees + READMEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch files, folders and knowledge from all repos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const targets = [
              { name: 'quant-econ' },
              { name: 'news-dashboards' },
              { name: 'agent-tools' },
              { name: 'mobile-android' },
              { name: 'geo-unity' },
              { name: 'UHI_SAUDI', pinned: true },
              { name: '1ooo', pinned: true },
              { name: 'future_proofing', pinned: true },
              { name: 'SectorShift', pinned: true },
            ];

            const data = { generated_at: new Date().toISOString(), repos: [] };

            async function getReadme(repo, dirPath) {
              try {
                const { data } = await github.rest.repos.getReadme({
                  owner: 'muxd22-alt', repo,
                  ...(dirPath ? { dir_path: dirPath } : {}),
                });
                const buf = Buffer.from(data.content, 'base64').toString('utf-8');
                return buf.slice(0, 8000);
              } catch (e) {
                return null;
              }
            }

            for (const t of targets) {
              const { data: repo } = await github.rest.repos.get({ owner: 'muxd22-alt', repo: t.name });

              const { data: tree } = await github.rest.git.getTree({
                owner: 'muxd22-alt', repo: t.name,
                tree_sha: repo.default_branch, recursive: '1',
              });

              const files = tree.tree
                .filter(e => e.type === 'blob')
                .map(e => [e.path, e.size || 0]);

              const root_readme = await getReadme(t.name, '');

              let members = [];
              if (t.pinned) {
                members = [{ name: t.name, path: '', readme: root_readme }];
              } else {
                const names = [...new Set(
                  files.map(f => f[0].startsWith('repos/') ? f[0].split('/')[1] : null)
                       .filter(Boolean)
                )].sort();
                for (const m of names) {
                  members.push({
                    name: m,
                    path: 'repos/' + m,
                    readme: await getReadme(t.name, 'repos/' + m),
                  });
                }
              }

              data.repos.push({
                name: t.name,
                url: repo.html_url,
                pinned: !!t.pinned,
                description: repo.description,
                default_branch: repo.default_branch,
                root_readme,
                members,
                files,
                truncated: !!tree.truncated,
              });
              core.info(`${t.name}: ${files.length} files, ${members.length} members`);
            }

            fs.writeFileSync('data.json', JSON.stringify(data));

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged"
          else
            git commit -m "Refresh dashboard data"
            git push
          fi
