name: Refresh dashboard data

on:
  schedule:
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Collect repo content + knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch files, folders, READMEs and knowledge data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const targets = [
              { name: 'quant-econ' },
              { name: 'news-dashboards' },
              { name: 'agent-tools' },
              { name: 'mobile-android' },
              { name: 'geo-unity' },
              { name: 'UHI_SAUDI', pinned: true },
              { name: '1ooo', pinned: true },
              { name: 'future_proofing', pinned: true },
              { name: 'SectorShift', pinned: true },
            ];

            // ---- knowledge discovery patterns (tier A feeds/data, B docs, C tables) ----
            const KDATA = /(^|\/)(rss|feed|atom)\.xml$|(^|\/)(data|news[\w-]*|feed[\w-]*|gaps?[\w-]*|scout[\w-]*|digest[\w-]*|summary[\w-]*|timeline[\w-]*|items[\w-]*|links[\w-]*|stories[\w-]*|results[\w-]*)\.json$/i;
            const KDOC  = /(ROADMAP|ARCHITECTURE|REPORT|SUMMARY|DIGEST|BRIEF|FINDINGS|ANALYSIS|RESULTS|STATE)[\w-]*\.md$/i;
            const KTABLE = /\.(geojson|csv)$/i;
            const KSKIP = /(^|\/)(node_modules|\.venv|venv|dist|__pycache__|\.git|site-packages|\.next|target|Pods|\.gradle)(\/|$)|_variants|third_party/;
            const MAX_FILE = 250_000;   // per knowledge file
            const PER_MEMBER = 4;
            const PER_REPO = 24;
            const MAX_TOTAL = 6_000_000;

            async function getFile(repo, path) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: 'muxd22-alt', repo, path,
                });
                if (data.type !== 'file') return null;
                return Buffer.from(data.content, 'base64').toString('utf-8');
              } catch (e) {
                return null;
              }
            }

            async function getReadme(repo, dirPath) {
              try {
                const { data } = await github.rest.repos.getReadme({
                  owner: 'muxd22-alt', repo,
                  ...(dirPath ? { dir_path: dirPath } : {}),
                });
                return Buffer.from(data.content, 'base64').toString('utf-8').slice(0, 8000);
              } catch (e) {
                return null;
              }
            }

            const data = { generated_at: new Date().toISOString(), repos: [], knowledge: [] };
            const knowledgePlan = [];
            let knowledgeBytes = 0;

            for (const t of targets) {
              const { data: repo } = await github.rest.repos.get({ owner: 'muxd22-alt', repo: t.name });
              const { data: tree } = await github.rest.git.getTree({
                owner: 'muxd22-alt', repo: t.name,
                tree_sha: repo.default_branch, recursive: '1',
              });

              const files = tree.tree
                .filter(e => e.type === 'blob')
                .map(e => [e.path, e.size || 0]);

              const root_readme = await getReadme(t.name, '');

              let members = [];
              if (t.pinned) {
                members = [{ name: t.name, path: '', readme: root_readme }];
              } else {
                const names = [...new Set(
                  files.map(f => f[0].startsWith('repos/') ? f[0].split('/')[1] : null)
                       .filter(Boolean)
                )].sort();
                for (const m of names) {
                  members.push({
                    name: m,
                    path: 'repos/' + m,
                    readme: await getReadme(t.name, 'repos/' + m),
                  });
                }
              }

              // ---- discover knowledge files in this repo ----
              const byMember = new Map();
              for (const [path, size] of files) {
                if (size > MAX_FILE || KSKIP.test(path)) continue;
                if (!t.pinned && !path.startsWith('repos/')) continue;
                const tier = KDATA.test(path) ? 0 : KDOC.test(path) ? 1 : KTABLE.test(path) ? 2 : -1;
                if (tier < 0) continue;
                const member = t.pinned ? t.name : path.split('/')[1];
                const memberPath = t.pinned ? '' : 'repos/' + member;
                if (!byMember.has(member)) byMember.set(member, { member, memberPath, paths: [] });
                byMember.get(member).paths.push({ path, tier, size });
              }
              let repoCount = 0;
              for (const [member, entry] of byMember) {
                entry.paths.sort((a, b) => a.tier - b.tier || b.path.localeCompare(a.path));
                entry.paths = entry.paths.slice(0, PER_MEMBER);
                if (repoCount + entry.paths.length > PER_REPO) {
                  entry.paths = entry.paths.slice(0, Math.max(0, PER_REPO - repoCount));
                }
                repoCount += entry.paths.length;
                if (entry.paths.length) {
                  knowledgePlan.push({ repo: t.name, member, memberPath: entry.memberPath, files: entry.paths });
                }
              }

              data.repos.push({
                name: t.name,
                url: repo.html_url,
                pinned: !!t.pinned,
                description: repo.description,
                default_branch: repo.default_branch,
                root_readme,
                members,
                files,
                truncated: !!tree.truncated,
              });
              core.info(`${t.name}: ${files.length} files, ${members.length} members`);
            }

            // ---- fetch knowledge file contents ----
            for (const plan of knowledgePlan) {
              const files = {};
              for (const f of plan.files) {
                if (knowledgeBytes > MAX_TOTAL) break;
                const text = await getFile(plan.repo, f.path);
                if (text == null) continue;
                const rel = plan.memberPath ? f.path.slice(plan.memberPath.length + 1) : f.path;
                files[rel] = text;
                knowledgeBytes += text.length;
              }
              if (Object.keys(files).length) {
                data.knowledge.push({
                  repo: plan.repo,
                  member: plan.member,
                  label: plan.member,
                  files,
                });
              }
            }
            core.info(`knowledge: ${data.knowledge.length} sources, ${knowledgeBytes} bytes`);

            fs.writeFileSync('data.json', JSON.stringify(data));

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged"
          else
            git commit -m "Refresh dashboard data"
            git push
          fi
