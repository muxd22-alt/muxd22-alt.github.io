<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUXD Content Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <h1>MUXD Content Dashboard</h1>
    <p class="sub">Every file, folder and README across all repos — unified. <span id="generated"></span></p>
  </div>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Search files, folders, members across all repos…" autocomplete="off">
    <div id="results" class="results" hidden></div>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="side-title">Repositories</div>
    <nav id="tree"></nav>
  </aside>

  <main id="content"></main>
</div>

<footer>
  <p id="footer-stats"></p>
  <p>Content aggregated from the source repos by GitHub Actions · <a href="https://github.com/muxd22-alt/muxd22-alt.github.io">muxd22-alt.github.io</a></p>
</footer>

<script src="app.js"></script>
</body>
</html>
